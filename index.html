<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Meany</title>
  </head>
  <body class="idle">
    <div class="app">
      <header class="masthead">
        <h1 id="title">Meany</h1>
        <p class="tagline">A voice chat that talks back</p>
      </header>

      <main class="card">
        <div class="stage">
          <p id="idle-msg">Press Start, then just talk.</p>
          <div id="emoji" aria-hidden="true"></div>
          <canvas id="wave-out" class="wave" aria-hidden="true"></canvas>
        </div>

        <button id="start" type="button" aria-label="Start">
          <span class="progress" aria-hidden="true"></span>
          <span class="dot" aria-hidden="true"></span>
          <span id="start-label">Start</span>
          <span id="route" aria-hidden="true"></span>
        </button>
        <p id="hint">Your microphone is used only while the chat is on</p>

        <canvas id="wave-in" class="wave" aria-hidden="true"></canvas>
        <p id="note" role="status" aria-live="polite"></p>

        <section id="settings" aria-label="Settings">
          <div class="setting">
            <div class="setting-head">
              <span class="label" id="voice-label">Voice</span>
              <span class="when-on">Stop the chat to change</span>
            </div>
            <div class="segmented" role="radiogroup" aria-labelledby="voice-label">
              <label><input type="radio" name="voice" value="female" /><span>Female</span></label>
              <label><input type="radio" name="voice" value="male" /><span>Male</span></label>
            </div>
          </div>

          <div class="setting">
            <div class="setting-head">
              <label class="label" for="tone">Attitude</label>
              <strong id="tone-name"></strong>
            </div>
            <input id="tone" type="range" min="0" max="4" step="1" />
            <div class="ticks" aria-hidden="true">
              <span>Friendly</span><span>Cheeky</span><span>Sassy</span><span>Spicy</span><span>Savage</span>
            </div>
            <p id="tone-blurb"></p>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p id="version"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
